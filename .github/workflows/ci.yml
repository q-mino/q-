name: Checks

on:
  pull_request:
  push:
    branches: [main, acceptance]

# A new push to the same pull request or branch stops the run it overtakes.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # The whole history, origin/main with it: q-'s tree is compared with
      # main's registries (DOM-24), which the generator reads from git.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # A diff of Markdown only runs no checks (A, 23 Nov 2026: as `pnpm check`
      # is skipped locally for such a diff); Prettier still checks it on the
      # next run with code. The job runs anyway and reports success, so
      # `check`, required on main, never waits for a run that never starts (a
      # `paths-ignore` on the workflow would leave it waiting).
      - name: What the diff touches
        id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ] \
            || ! files=$(git diff --name-only "$BASE" HEAD); then
            echo "code=true" >> "$GITHUB_OUTPUT"
          elif printf '%s\n' "$files" | grep -qv '\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Markdown only: no checks." >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.diff.outputs.code == 'true'
        uses: pnpm/action-setup@v6
      - if: steps.diff.outputs.code == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.diff.outputs.code == 'true'
        run: pnpm install --frozen-lockfile
      # The checks in one step (TST-11): the generated files (DOM-24, DOM-25),
      # then typecheck (domains without DOM or Node), lint, format and the
      # architecture graph together, then the tests; each one's time and peak
      # in the job summary, a warning past its threshold (TST-13).
      - name: Checks
        if: steps.diff.outputs.code == 'true'
        run: pnpm check
      - name: Build the PWA
        if: steps.diff.outputs.code == 'true'
        run: pnpm build
