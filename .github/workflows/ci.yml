name: Checks

# A diff of Markdown only runs no checks (A, 23 Nov 2026: as `pnpm check` is
# skipped locally for such a diff); Prettier still checks them on the next run.
on:
  pull_request:
    paths-ignore: ['**/*.md']
  push:
    branches: [main, acceptance]
    paths-ignore: ['**/*.md']

# A new push to the same pull request or branch stops the run it overtakes.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # The whole history, origin/main with it: q-'s tree is compared with
      # main's registries (DOM-24), which the generator reads from git.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated files (DOM-24, DOM-25)
        run: pnpm generate:check
      - name: Type check (domains without DOM or Node)
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Architecture graph
        run: pnpm graph
      - name: Tests
        run: pnpm test
      - name: Build the PWA
        run: pnpm build
