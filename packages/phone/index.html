<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <!-- composed by build/compose.ts -->
    <!-- The keyboard resizes the page (part M5 of messaging): a screen, a conversation's field
         at its bottom too, stays above it instead of under it. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <!-- The bar's colour by theme (PWA-7): Roano's paper, Lavagna's slate. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbf8f3" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1b2023" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./icon-192.png" sizes="192x192" type="image/png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Cumino</title>
    <!-- Roano and Lavagna (WEB-26): the page declares both schemes, so that a browser that darkens
         pages by itself (Chrome's "darken websites", Brave, Opera) leaves it to its own dark theme. -->
    <meta name="color-scheme" content="light dark" />
    <link rel="stylesheet" href="./adapters-web/src/design/styles/reset.css" />
    <link rel="stylesheet" href="./adapters-web/src/design/styles/tokens.css" />
    <link rel="stylesheet" href="./adapters-web/src/design/styles/layout.css" />
    <link rel="stylesheet" href="./adapters-web/src/design/styles/components.css" />
    <link rel="stylesheet" href="./adapters-web/src/screens/screens.css" />
    <link rel="stylesheet" href="./phone/src/app.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./phone/src/main.js"></script>
  </body>
</html>
