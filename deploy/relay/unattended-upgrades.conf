// The machine's updates (REL-7): Debian's unattended-upgrades, with its own
// origins (the security archive and the stable point releases); a reboot when
// an update asks for one, at 04:00 UTC: the relay starts again with the
// machine, and the phones send again (PST-6). [Q, C, 25 Nov 2026]
APT::Periodic::Update-Package-Lists "1";
APT::Periodic::Unattended-Upgrade "1";
APT::Periodic::AutocleanInterval "7";
Unattended-Upgrade::Automatic-Reboot "true";
Unattended-Upgrade::Automatic-Reboot-Time "04:00";
Unattended-Upgrade::Remove-Unused-Dependencies "true";
