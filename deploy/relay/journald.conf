# The machine's journal kept short (REL-7): a week, 200 MB at most. It holds the
# relay's lines (its start, its stop, its faults: REL-1), Caddy's faults and
# certificates, and the system's own (sshd's logins among them, the
# operator's); nothing about the relay's requests (CFG-3). [Q, C, 25 Nov 2026]

[Journal]
Storage=persistent
SystemMaxUse=200M
MaxRetentionSec=7day
