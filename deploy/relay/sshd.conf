# SSH by key only (REL-7): no root, no passwords; the two users of the machine,
# `admin` (Lightsail's, who provisions, sudo) and `deploy` (who deploys, a
# sudo of two commands). [Q, C, 25 Nov 2026]

PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AllowUsers admin deploy
